name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/paw-darwin-arm64 ./cmd/paw
          GOOS=darwin GOARCH=amd64 go build -o dist/paw-darwin-x64 ./cmd/paw
          GOOS=linux GOARCH=amd64 go build -o dist/paw-linux-x64 ./cmd/paw
          GOOS=linux GOARCH=arm64 go build -o dist/paw-linux-arm64 ./cmd/paw

      - name: Generate docs artifacts
        run: |
          mkdir -p dist/completions dist/man
          go run ./cmd/paw completion bash > dist/completions/paw.bash
          go run ./cmd/paw completion zsh > dist/completions/_paw
          go run ./cmd/paw completion fish > dist/completions/paw.fish
          go run ./cmd/paw man --dir dist/man
          tar -czf dist/paw-manpages.tar.gz -C dist man
          tar -czf dist/paw-completions.tar.gz -C dist completions

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/paw-darwin-arm64
            dist/paw-darwin-x64
            dist/paw-linux-x64
            dist/paw-linux-arm64
            dist/paw-manpages.tar.gz
            dist/paw-completions.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
