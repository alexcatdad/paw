name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' || !startsWith(github.ref, 'refs/tags/')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$HEAD_MESSAGE" | head -1 | grep -qE '^(docs|ci|chore|test|style)(\(.+\))?:'; then
            echo "Non-release commit type. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [[ -z "$latest_tag" ]]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "${version}"

          commits=$(git log "${latest_tag}"..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          bump="none"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$msg" | grep -qi 'BREAKING CHANGE'; then
              bump="major"
              break
            fi
            if echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              [[ "$bump" != "major" ]] && bump="minor"
            fi
            if echo "$msg" | grep -qE '^(fix|perf|refactor)(\(.+\))?:'; then
              [[ "$bump" == "none" ]] && bump="patch"
            fi
          done <<< "${commits}"

          if [[ "$bump" == "none" ]]; then
            echo "No version-bumping commits found. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.skip != 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"

      - uses: actions/setup-go@v6
        if: steps.version.outputs.skip != 'true'
        with:
          go-version: '1.26'

      - name: Run tests
        if: steps.version.outputs.skip != 'true'
        run: go test ./...

      - name: Build binaries
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          ldflags="-s -w -X github.com/alexcatdad/paw/internal/cli.version=${version}"
          GOOS=darwin GOARCH=arm64 go build -ldflags "${ldflags}" -o dist/paw-darwin-arm64 ./cmd/paw
          GOOS=darwin GOARCH=amd64 go build -ldflags "${ldflags}" -o dist/paw-darwin-x64 ./cmd/paw
          GOOS=linux GOARCH=amd64 go build -ldflags "${ldflags}" -o dist/paw-linux-x64 ./cmd/paw
          GOOS=linux GOARCH=arm64 go build -ldflags "${ldflags}" -o dist/paw-linux-arm64 ./cmd/paw

      - name: Generate docs artifacts
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist/completions dist/man
          go run ./cmd/paw completion bash > dist/completions/paw.bash
          go run ./cmd/paw completion zsh > dist/completions/_paw
          go run ./cmd/paw completion fish > dist/completions/paw.fish
          go run ./cmd/paw man --dir dist/man
          tar -czf dist/paw-manpages.tar.gz -C dist man
          tar -czf dist/paw-completions.tar.gz -C dist completions

      - name: Attest build provenance
        if: steps.version.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/paw-darwin-arm64
            dist/paw-darwin-x64
            dist/paw-linux-x64
            dist/paw-linux-arm64
            dist/paw-manpages.tar.gz
            dist/paw-completions.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    environment: action-runners
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Get GitHub App user ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p assets
          gh release download "${TAG}" --repo "${{ github.repository }}" \
            --pattern 'paw-darwin-arm64' \
            --pattern 'paw-darwin-x64' \
            --pattern 'paw-linux-x64' \
            --pattern 'paw-linux-arm64' \
            --dir assets

      - name: Compute SHA256 checksums
        id: sha
        run: |
          {
            echo "darwin_arm64=$(sha256sum assets/paw-darwin-arm64 | cut -d' ' -f1)"
            echo "darwin_x64=$(sha256sum assets/paw-darwin-x64 | cut -d' ' -f1)"
            echo "linux_x64=$(sha256sum assets/paw-linux-x64 | cut -d' ' -f1)"
            echo "linux_arm64=$(sha256sum assets/paw-linux-arm64 | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}

      - name: Strip version prefix
        id: ver
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.sha.outputs.darwin_x64 }}
          SHA_LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
        run: |
          cat > Formula/paw.rb << EOF
          class Paw < Formula
            desc "Personal dotfiles manager CLI"
            homepage "https://alexcatdad.github.io/paw/"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/alexcatdad/paw/releases/download/v#{version}/paw-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end

              on_intel do
                url "https://github.com/alexcatdad/paw/releases/download/v#{version}/paw-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/alexcatdad/paw/releases/download/v#{version}/paw-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end

              on_intel do
                url "https://github.com/alexcatdad/paw/releases/download/v#{version}/paw-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              binary = Dir["paw-*"].first || "paw"
              bin.install binary => "paw"
            end

            test do
              assert_match "paw", shell_output("#{bin}/paw --help")
            end
          end
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Formula/paw.rb
          git diff --staged --quiet || {
            git commit -m "chore: update paw to ${VERSION}"
            git push
          }
