name: integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-linux:
    name: Quality (Lint + Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build quality image
        run: docker build -f tests/docker/Dockerfile.test -t paw-quality-env:local .
      - name: Run quality checks in Docker
        run: |
          docker run --rm \
            -e RUN_VULNCHECK=1 \
            -e SEVERITY_THRESHOLD=high \
            -e QUALITY_STAGE=baseline \
            -e HOME=/tmp/paw-home \
            -e PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            paw-quality-env:local \
            bash -lc "./scripts/test/quality-check.sh"
      - name: Upload security summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.json

  test-linux:
    name: Test (Linux Docker + Coverage)
    runs-on: ubuntu-latest
    needs: quality-linux
    env:
      COVERAGE_STAGE: ${{ vars.PAW_COVERAGE_STAGE || '80' }}
      SKIP_QUALITY: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized test + coverage
        run: ./scripts/test/docker-ci.sh
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: |
            coverage.out
            coverage-packages.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Linux binary
        run: go build -o dist/paw-linux-x64 ./cmd/paw
      - name: Smoke
        run: |
          ./dist/paw-linux-x64 --version 2>version.err
          ./dist/paw-linux-x64 --help >/tmp/paw-help.txt 2>help.err
          test ! -s version.err
          test ! -s help.err

  test-macos:
    name: Smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build and smoke
        run: |
          go build -o dist/paw-darwin-arm64 ./cmd/paw
          ./dist/paw-darwin-arm64 --version 2>version.err
          ./dist/paw-darwin-arm64 --help >/tmp/paw-help.txt 2>help.err
          test ! -s version.err
          test ! -s help.err
          ./dist/paw-darwin-arm64 man --dir ./dist/man
          ./dist/paw-darwin-arm64 completion zsh >/tmp/paw-zsh-completion

  test-wsl:
    name: Smoke (WSL Runtime)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Linux binary for WSL
        shell: pwsh
        run: |
          $env:GOOS='linux'
          $env:GOARCH='amd64'
          go build -o dist/paw-linux-x64 ./cmd/paw
      - name: Run in WSL
        shell: pwsh
        run: |
          $distroList = (wsl -l -q 2>$null)
          if ([string]::IsNullOrWhiteSpace($distroList)) {
            Write-Host "No WSL distro available on runner; skipping WSL smoke step."
            exit 0
          }
          $workspace = "${{ github.workspace }}"
          $wslWorkspace = (wsl wslpath -a "$workspace").Trim()
          wsl bash -lc "cd \"$wslWorkspace/dist\" && chmod +x paw-linux-x64 && export WSL_DISTRO_NAME=Ubuntu && ./paw-linux-x64 --version && ./paw-linux-x64 --help && ./paw-linux-x64 status --help >/dev/null"
